name: Build and Push google-workspace-mcp

# Triggers (deliberately NO `schedule:` — see crunchtools/constitution validate-cascade):
#   push                — Containerfile / workflow changes
#   pull_request        — Trivy scan + SBOM only, no push
#   repository_dispatch parent-image-updated — fired when an upstream image we
#     FROM rebuilds (handled by Hermes / the cascade).
#   workflow_dispatch   — manual rebuild on demand
#
# Profile alignment (crunchtools container image profile): Trivy vulnerability
# scan blocking on HIGH/CRITICAL, SBOM generation, dual registry push
# (Quay + GHCR). Cosign signing deferred to a later hardening pass.
#
# Constitution Section III (RT #1480): the two registry pushes are now two
# separate jobs rather than four steps in one, and the build moved to
# docker/build-push-action because buildah has no equivalent of
# cache-from/cache-to type=gha.
#
# Deviation worth knowing about: Section III describes the Trivy gate as
# continue-on-error. This repo has always run it blocking (exit-code 1) and
# that is left alone -- turning a security gate advisory is not a side effect
# a CI cleanup should have.

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [parent-image-updated]
  workflow_dispatch:

env:
  QUAY_IMAGE: quay.io/crunchtools/google-workspace-mcp
  GHCR_IMAGE: ghcr.io/crunchtools/google-workspace-mcp

jobs:
  build-and-push-quay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha_short: ${{ steps.version.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version tag
        id: version
        run: |
          TAG=$(git describe --tags --always 2>/dev/null || echo "v0.1.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # load: true puts the image in the local daemon so the scans below read it
      # directly. This replaces the save to /tmp/gwsmcp.tar.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: google-workspace-mcp:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: google-workspace-mcp:scan
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM (Trivy / SPDX-JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: google-workspace-mcp:scan
          format: "spdx-json"
          output: "google-workspace-mcp-sbom.spdx.json"
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-workspace-mcp-sbom-${{ steps.version.outputs.sha_short }}
          path: google-workspace-mcp-sbom.spdx.json
          retention-days: 90

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Cache hit, not a rebuild -- this is what cache-to: mode=max above buys.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.QUAY_IMAGE }}:latest
            ${{ env.QUAY_IMAGE }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Google Workspace MCP server for the crunchtools fleet
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-ghcr:
    runs-on: ubuntu-latest
    needs: build-and-push-quay
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ needs.build-and-push-quay.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Google Workspace MCP server for the crunchtools fleet
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
