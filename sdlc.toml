[tool.sdlc]
repo-kinds = ["forked-mcp-server"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/google-workspace-mcp"
boot = "healthcheck"
boot-env = "GOOGLE_OAUTH_CLIENT_ID=gate-dummy.apps.googleusercontent.com\nGOOGLE_OAUTH_CLIENT_SECRET=gate-dummy\nWORKSPACE_MCP_HOST=0.0.0.0\nEXTERNAL_OAUTH21_PROVIDER=true\nMCP_ENABLE_OAUTH21=true\nWORKSPACE_MCP_STATELESS_MODE=true\nWORKSPACE_EXTERNAL_URL=http://localhost:8000/mcp\n"
